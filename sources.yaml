    independence: "Publisher-entered package metadata is distinct from job taxonomies but duplicated across ecosystems and is not evidence of a practitioner's skill."
    constraints: "Package metadata reuse and package artifact licensing are separate questions; preserve package-declared licenses without treating them as metadata licenses."
    rationale: "Use package dependency edges as a technical composition signal, not as a proxy for professional competency or effort."
