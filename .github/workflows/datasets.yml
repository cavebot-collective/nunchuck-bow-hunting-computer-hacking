name: Build source datasets
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  stackoverflow-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect Stack Overflow tags
        run: python scripts/collect_stackoverflow_tags.py
      - name: Verify package
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("dist/stackoverflow-tags")
          m=json.loads((p/"manifest.json").read_text())
          for f in m["files"]:
              b=(p/f["path"]).read_bytes()
              assert hashlib.sha256(b).hexdigest()==f["sha256"]
              assert len(b)==f["bytes"]
          print("manifest checksums OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stackoverflow-tags
          path: dist/stackoverflow-tags/
          if-no-files-found: error
